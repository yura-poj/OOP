version: '3.9'

networks:
  broadcast_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  manager:
    build: ./src/main/java/ru/nsu/pozhidaev/manager
    networks:
      broadcast_net:
        ipv4_address: 172.28.0.10

  worker1:
    build: ./src/main/java/ru/nsu/pozhidaev/worker
    networks:
      broadcast_net:
        ipv4_address: 172.28.0.11

  worker2:
    build: ./src/main/java/ru/nsu/pozhidaev/worker
    networks:
      broadcast_net:
        ipv4_address: 172.28.0.12